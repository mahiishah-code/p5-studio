<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>p5 Studio Preview</title>
<style>
  body { margin: 0; min-height: 100vh; background: #111; color: #aaa;
         font: 14px system-ui, sans-serif; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 12px; }
  canvas { clip-path: circle(50%); }
  code { color: #eee; }
</style>
</head>
<body>
<p id="label"></p>
<script>
// Usage (with Live Server):  preview.html?sketch=drift&seed=3&frames=150
// Uses the same harness as the headless renderer, so the same seed gives
// the same image here as in a render_sketch call.
const params = new URLSearchParams(location.search);
const sketch = params.get('sketch') || 'drift';
document.getElementById('label').innerHTML =
    `<code>${sketch}</code> &middot; seed <code>${params.get('seed') || 1}</code>` +
    ` &middot; stops after <code>${params.get('frames') || 1}</code> frame(s)`;

function load(src) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('Could not load ' + src));
        document.body.appendChild(s);
    });
}

// Same order as render.js: sketch, then harness, then p5.
load(`sketches/${sketch}.js`)
    .then(() => load('harness/harness.js'))
    .then(() => load('node_modules/p5/lib/p5.min.js'))
    .catch((err) => { document.getElementById('label').textContent = err.message; });
</script>
</body>
</html>
